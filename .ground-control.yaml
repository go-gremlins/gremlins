# Ground Control repository context (generated by grndctl init).
schema_version: 1
project: go-rae-gremlins
github_repo: OpenRAE/go-rae-gremlins
workflow:
  # make test runs go test -race ./... (about one minute).
  test_command: make test
  # make all runs make lint, make test, and make build. CI owns this gate.
  completion_command: make all
  lint_command: make lint
  # The formatter of .golangci.yml is goimports. golangci-lint fmt applies it.
  format_command: golangci-lint fmt ./...
  # The repository has no make policy target. Its gates are the hooks of
  # .pre-commit-config.yaml: file checks, golangci-lint, gitleaks, govulncheck,
  # and the race tests.
  policy_command: pre-commit run --all-files
  precommit_command: pre-commit run --hook-stage pre-commit
  base_branch: dev
  pr_title:
    types: [feat, fix, docs, chore, refactor, test, build, ci, perf, style, revert]
    require_scope: false
    subject_pattern: '^[a-z].*$'
  codex_review:
    pre_push_cap: 1
sonarcloud:
  project_key: go-rae-gremlins_go-rae-gremlins
  organization: go-rae-gremlins
rules:
  plan_rules: .gc/plan-rules.md
docs:
  adr_dir: docs/adr/
  # CLAUDE.md holds the architecture, the key flows, the module structure, and
  # the testing conventions of the repository.
  architecture_overview: CLAUDE.md
  coding_standards: CLAUDE.md
  workflow_reference: docs/CONTRIBUTING.md
example_paths:
  source: internal/engine/
  test: internal/engine/
cross_cutting_concerns:
  description: |
    Module: github.com/go-gremlins/gremlins, the OpenRAE fork of go-gremlins/gremlins. go 1.25.0, toolchain go1.26.10.
    CLI: cobra commands in cmd/ (gremlins.go, unleash.go). The binary entry point is cmd/gremlins/main.go.
    Configuration: Viper. Flags override .gremlins.yaml, and .gremlins.yaml overrides the defaults. The keys are constants in internal/configuration/configuration.go. Environment variables use the GREMLINS prefix. docs/docs/schema/configuration.json is the JSON schema of the configuration file, and docs/docs/usage/ documents the flags and keys.
    Logging: internal/log (Init, Infof, Infoln, Errorf, Errorln, and the silent mode).
    Errors: errors.New, errors.Is, errors.As, and fmt.Errorf with %w. Process exit codes come from internal/execution (ExitError).
    Processes: internal/engine/executor.go runs go test for each mutant. internal/coverage runs go test with a coverage profile. internal/diff runs git diff.
    Isolation: each mutant runs in a temporary copy of the module (internal/engine/workdir) on a worker pool (internal/engine/workerpool).
    Reports: internal/report writes the console report and the JSON output file.
    Tests: table-driven tests with the race detector (make test). Files in testdata directories are byte-exact test inputs.
    Lint: golangci-lint v2 with .golangci.yml, which includes the goimports formatter (make lint).
architecture:
  vocabulary:
    patterns:
      - name: Mutation type
        applies_to: a new mutation type; the steps are in the Adding New Mutation Type section of CLAUDE.md
        example_path: internal/engine/tokenmutator.go
      - name: Table-driven test
        applies_to: unit tests
        example_path: internal/engine/executor_test.go
    canonical_helpers:
      - name: Logger
        path: internal/log/log.go
        purpose: all console and error output of the tool
      - name: Exit errors
        path: internal/execution/execution.go
        purpose: process exit codes, for example for failed thresholds
      - name: Configuration keys
        path: internal/configuration/configuration.go
        purpose: the Viper keys of the flags, the configuration file, and the environment
      - name: Work directory copy
        path: internal/engine/workdir/workdir.go
        purpose: the temporary module copy that each mutant runs in
    boundary_contract:
      description: |
        go-rae-gremlins is the OpenRAE fork of go-gremlins/gremlins. autarchy-ai/coldlight and OpenRAE/env-packs use it for mutation testing.
        The downstream contracts are the CLI flags, the configuration keys and their JSON schema, the JSON report, and the exit codes.
    anti_recommendations:
      - Do not change a CLI flag, a configuration key, the JSON report, or an exit code unless the issue asks for it.
      - Do not change the module path before an ADR records the decision (#69).
      - Do not reformat files in testdata directories. They are byte-exact test inputs.
