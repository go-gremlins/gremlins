sonar.projectKey=OpenRAE_go-rae-gremlins
sonar.organization=raesystem

# Analyze the whole repository. The test inclusions move the Go, Python, and transport tests out of
# the sources. The testdata directories hold fixtures for the mutation tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,scripts/test_lint.py,.github/ground-control/**/*.mjs,.github/ground-control/fixtures/**/*.cjs,**/testdata/**,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,scripts/test_lint.py,.github/ground-control/**/*.mjs,.github/ground-control/fixtures/**/*.cjs
sonar.test.exclusions=**/testdata/**

# The CI test job writes this coverage profile with `make cover`.
sonar.go.coverage.reportPaths=coverage/coverage.out
sonar.python.coverage.reportPaths=coverage/python-coverage.xml
