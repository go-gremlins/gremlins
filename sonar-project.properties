sonar.projectKey=go-rae-gremlins_go-rae-gremlins
sonar.organization=go-rae-gremlins

# Analyze the whole repository. The test inclusions move the Go tests out of
# the sources. The testdata directories hold fixtures for the mutation tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/testdata/**

# The SonarCloud workflow writes this coverage profile with `make cover`.
sonar.go.coverage.reportPaths=coverage.out
