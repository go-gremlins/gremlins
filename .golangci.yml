version: "2"

run:
  relative-path-mode: cfg
  modules-download-mode: readonly
  tests: true
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - importas
    - ineffassign
    - maintidx
    - makezero
    - nakedret
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testableexamples
    - thelper
    - unconvert
    - unused
    - usestdlibvars
    - usetesting
  exclusions:
    generated: strict
    presets: []
    paths:
      - '(^|/)testdata/'
      - '(^|/)vendor/'
      - '^dist/'
  settings:
    depguard:
      rules:
        approved-imports:
          list-mode: strict
          files: [$all]
          allow:
            - $gostd
            - github.com/OpenRAE/go-rae-gremlins/
            - github.com/MakeNowJust/heredoc$
            - github.com/aymanbagabas/go-udiff$
            - github.com/bluekeyes/go-gitdiff/gitdiff$
            - github.com/fatih/color$
            - github.com/google/go-cmp/cmp$
            - github.com/google/go-cmp/cmp/cmpopts$
            - github.com/hako/durafmt$
            - github.com/hectane/go-acl$
            - github.com/mitchellh/go-homedir$
            - github.com/spf13/cobra$
            - github.com/spf13/pflag$
            - github.com/spf13/viper$
            - golang.org/x/tools/cover$
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
    gocritic:
      enabled-checks:
        - ptrToRefParam
        - sprintfQuotedString
    nakedret:
      max-func-lines: 30
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true
    revive:
      severity: error
      confidence: 0
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments: [check-private-receivers, check-public-interface]
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: package-naming
        - name: redundant-import-alias
        - name: import-alias-naming
        - name: enforce-slice-style
          arguments: [nil]
        - name: use-any
        - name: useless-break
        - name: unnecessary-if
        - name: unnecessary-format
        - name: waitgroup-by-value
        - name: imports-blocklist
          arguments:
            - github.com/stretchr/testify/**
            - github.com/onsi/gomega/**
            - github.com/smartystreets/goconvey/**
    staticcheck:
      checks: [all]
    tagliatelle:
      case:
        rules:
          json: snake

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: [github.com/OpenRAE/go-rae-gremlins]
  exclusions:
    generated: strict
    paths:
      - '(^|/)testdata/'
      - '(^|/)vendor/'
      - '^dist/'
