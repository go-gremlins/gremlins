version: 2
project_name: gremlins
before:
  hooks:
    - make clean
    - go mod download
gomod:
  proxy: true
builds:
  - main: ./cmd/gremlins
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
# release-please makes the GitHub release. goreleaser adds the assets to it.
release:
  mode: append
checksum:
  name_template: 'checksums.txt'
source:
  enabled: true
changelog:
  disable: true
snapshot:
  version_template: "{{ .Tag }}-next"
